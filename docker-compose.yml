version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: moodbite-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - moodbite-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: moodbite-backend
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://admin:password@mongodb:27017/moodbite
      DEBUG: "false"
    depends_on:
      - mongodb
    networks:
      - moodbite-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: moodbite-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - moodbite-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  moodbite-network:
    driver: bridge
